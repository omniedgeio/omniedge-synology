name: Auto-upgrade OmniEdge CLI

on:
  repository_dispatch:
    types: [cli-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version to upgrade to (e.g., 0.3.0)'
        required: true

jobs:
  upgrade-cli:
    name: Upgrade OmniEdge CLI version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi
          # Get current date for release notes
          echo "date=$(date '+%B %d, %Y')" >> $GITHUB_OUTPUT

      - name: Update README with new release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE="${{ steps.version.outputs.date }}"
          
          # Add new version to release notes table in README.md
          NEW_LINE="|${VERSION}|${DATE}|Automated CLI upgrade|"
          
          # Insert after the header row
          sed -i "/|--|--|--|/a ${NEW_LINE}" README.md
          echo "Updated README with version ${VERSION}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: upgrade omniedge-cli to v${{ steps.version.outputs.version }}"
          title: "🔄 Upgrade OmniEdge CLI to v${{ steps.version.outputs.version }}"
          body: |
            ## Automated CLI Upgrade

            This PR was automatically created by the CLI release workflow.

            **Changes:**
            - Added new version entry to `README.md` release notes

            **CLI Release:** https://github.com/omniedgeio/omniedge-cli/releases/tag/v${{ steps.version.outputs.version }}
            
            **Note:** After merging, please update the Synology package build scripts if needed.
          branch: auto-upgrade/cli-v${{ steps.version.outputs.version }}
          base: main
          labels: |
            automated
            dependency-update
